[webserver]
meditrack-web ansible_host=<EC2_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/meditrack_devops
#EC2_PUBLIC_IP est récupéré depuis la sortie de Terraform (terraform output)
#lors de la création de l'instance EC2 et correspond à l'IP publique de l'instance créée par Terraform.
[webserver:vars]
ansible_python_interpreter=/usr/bin/python3
